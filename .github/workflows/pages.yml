name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, claude/festive-ptolemy-pouoei]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r index.html style.css favicon.svg favicon.png js lib assets _site/
          # מספר גרסה לכל פרסום – כדי שהדפדפן לא ייתקע עם קבצים ישנים
          sed -i "s/__V__/${GITHUB_SHA::8}/g" _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
